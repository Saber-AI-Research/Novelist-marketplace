name: Update Download Counts

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: registry-write
  cancel-in-progress: false

jobs:
  update-counts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:registry -- --fetch-downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated counts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git diff --cached --quiet || git commit -m "chore: update download counts"
          git push

      - name: Trigger homepage rebuild
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEPAGE_TRIGGER_TOKEN }}
          repository: Saber-AI-Research/Novelist-homepage
          event-type: registry-updated
