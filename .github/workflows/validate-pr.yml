name: Validate PR

on:
  pull_request:
    branches: [main]
    paths:
      - "plugins/**"
      - "categories.json"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/**"

# Least privilege: this job validates UNTRUSTED PRs and fetches untrusted ZIPs,
# so it must never hold a write-capable token.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm validate

      - run: pnpm test
